<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>God's Eye View</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #020706;
        color: #b7ffcd;
      }
      main {
        width: min(440px, 100%);
        border: 1px solid #29ff78;
        padding: 24px;
        box-shadow: 0 0 32px #29ff7826;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 18px;
        letter-spacing: 0.12em;
      }
      p {
        margin: 0 0 20px;
        color: #a2b9aa;
        line-height: 1.5;
      }
      button {
        width: 100%;
        padding: 13px;
        border: 1px solid #29ff78;
        color: #b7ffcd;
        background: #07130c;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CONNECTION LOST</h1>
      <p>
        God's Eye View needs its secure companion server. Check your connection,
        then reconnect.
      </p>
      <button type="button" onclick="location.reload()">RECONNECT</button>
    </main>
  </body>
</html>
